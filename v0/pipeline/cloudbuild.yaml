# Builds the v0 job's image from the repository root with v0/pipeline/Dockerfile
# and pushes it beside production's images, tagged with the commit it was built
# from and as latest. Run from the repository root by v0/setup-v0.sh, which
# passes the commit:
#   gcloud builds submit --config v0/pipeline/cloudbuild.yaml --substitutions=_COMMIT=<commit> .
substitutions:
  _COMMIT: unknown
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - v0/pipeline/Dockerfile
      - --build-arg
      - COMMIT=$_COMMIT
      - -t
      - us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ringfacts-v0:$_COMMIT
      - -t
      - us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ringfacts-v0:latest
      - .
images:
  - us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ringfacts-v0:$_COMMIT
  - us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ringfacts-v0:latest
